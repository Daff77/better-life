services:
  - type: web
    name: better-life-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --prefix backend --include=dev && npm run build:backend
    startCommand: npm start --prefix backend
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: http://localhost:8081,http://localhost:8085
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: AI_BASE_URL
        value: https://arxpay.my.id/v1
      - key: AI_MODEL
        value: deepseek-v4.1-flash
      - key: AI_API_KEY
        sync: false
      - key: ENABLE_PAYMENT_SANDBOX
        value: "false"
