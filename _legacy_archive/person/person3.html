<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Personalization - Step 3 of 8 - Better Life</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../better-life.css" />

  <style>
    .header-section {
      padding: 1.5rem 1.5rem 0 1.5rem;
    }
    .main-content {
      flex-grow: 1;
      padding: 0 1.5rem;
    }
    .footer-section {
      padding: 2rem 1.5rem;
    }
    
    .header-title {
      font-family: var(--font-family-extrabold);
      font-weight: 800;
      color: #000000;
      font-size: 19px;
      letter-spacing: 0.5px;
    }
    .step-counter {
      font-family: var(--font-family-extrabold);
      font-weight: 800;
      font-size: 15px;
      color: var(--color-muted);
    }
    .step-counter .step-num {
      color: var(--color-primary);
    }
    
    .subtitle {
      font-family: var(--font-family-extrabold);
      font-weight: 800;
      color: #000000;
      font-size: 22px; 
      letter-spacing: 0.5px;
    }
    .progress-bar {
      background-color: var(--color-primary);
      transition: width var(--duration-component) var(--ease-smooth);
    }
    .progress {
      height: 6px;
      border-radius: 3px;
      background-color: var(--color-secondary);
    }
    
    .gender-card {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 80px;
      padding: 1rem;
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-md);
      background-color: #ffffff;
      color: #000;
      transition: all var(--duration-micro) var(--ease-smooth);
      cursor: pointer;
      width: 100%;
    }
    .gender-card:hover {
      border-color: var(--color-primary);
      box-shadow: 0 4px 15px rgba(103, 192, 144, 0.15);
      transform: translateY(-2px);
    }
    
    .gender-card.active {
      border-color: var(--color-primary);
      background-color: var(--color-primary-subtle);
      border-width: 2px;
    }
    
    .gender-card .gender-text {
      font-family: var(--font-family-extrabold);
      font-weight: 800;
      font-size: 18px;
    }
    .gender-card.active .gender-text {
      color: var(--color-primary);
    }

    .info-text {
      font-family: var(--font-family-semibold);
      font-weight: 600;
      color: var(--color-muted);
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
    }

    .back-arrow {
      cursor: pointer;
      transition: transform var(--duration-micro) var(--ease-smooth);
    }
    .back-arrow:hover {
      transform: translateX(-3px);
    }
  </style>
</head>
<body>

  <div class="personalization-container animate-fade-in">
    
    <header class="header-section">
      <div class="d-flex align-items-center mb-4">
        <a href="person2.html" class="me-3 back-arrow" aria-label="Back">
          <img src="../assets/back2.svg" alt="" width="18" height="36">
        </a>
        <h1 class="header-title flex-grow-1 mb-0">Personalization</h1>
        <div class="step-counter">
          <span class="step-num">Step 3</span> of 8
        </div>
      </div>
    </header>

    <main class="main-content">
      <div class="progress mb-4" role="progressbar" aria-valuenow="37.5" aria-valuemin="0" aria-valuemax="100">
        <div class="progress-bar" style="width: 37.5%"></div>
      </div>
      
      <h2 class="subtitle mb-4">What's your gender?</h2>

      <div class="row g-3" role="radiogroup" aria-label="Gender selection">
        <div class="col-6">
          <button type="button" class="gender-card active" data-gender="Female" role="radio" aria-checked="true">
            <span class="gender-text">Female</span>
          </button>
        </div>
        
        <div class="col-6">
          <button type="button" class="gender-card" data-gender="Male" role="radio" aria-checked="false">
            <span class="gender-text">Male</span>
          </button>
        </div>
      </div>
    </main>

    <footer class="footer-section">
      <p class="info-text mb-3">
        We use this information to calculate your nutritional needs and make personalized recommendations.
      </p>
      
      <a href="person4.html" class="btn-next w-100" style="height: 50px; font-size: 17px;" id="nextBtn">
        Next
      </a>
    </footer>

  </div>

  <script src="../storage.js"></script>
  <script>
    const savedGender = BetterLifeState.get('gender', 'Female');
    const cards = document.querySelectorAll('.gender-card');

    cards.forEach(card => {
      const g = card.getAttribute('data-gender');
      if (g === savedGender) {
        card.classList.add('active');
        card.setAttribute('aria-checked', 'true');
      } else {
        card.classList.remove('active');
        card.setAttribute('aria-checked', 'false');
      }

      card.addEventListener('click', function() {
        cards.forEach(c => {
          c.classList.remove('active');
          c.setAttribute('aria-checked', 'false');
        });
        this.classList.add('active');
        this.setAttribute('aria-checked', 'true');
        BetterLifeState.set('gender', g);
        BetterLifeState.calculateCalories();
      });
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
