<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Personalization - Step 2 of 8 - Better Life</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../better-life.css" />

  <style>
    .header-section {
      padding: 1.5rem 1.5rem 0 1.5rem;
    }
    .main-content {
      flex-grow: 1;
      padding: 0 1.5rem;
    }
    .footer-section {
      padding: 2rem 1.5rem;
    }
    
    .header-title {
      font-family: var(--font-family-extrabold);
      font-weight: 800;
      color: #000000;
      font-size: 19px;
      letter-spacing: 0.5px;
    }
    .step-counter {
      font-family: var(--font-family-extrabold);
      font-weight: 800;
      font-size: 15px;
      color: var(--color-muted);
    }
    .step-counter .step-num {
      color: var(--color-primary);
    }
    
    .subtitle {
      font-family: var(--font-family-extrabold);
      font-weight: 800;
      color: #000000;
      font-size: 22px; 
      letter-spacing: 0.5px;
    }
    .progress-bar {
      background-color: var(--color-primary);
      transition: width var(--duration-component) var(--ease-smooth);
    }
    .progress {
      height: 6px;
      border-radius: 3px;
      background-color: var(--color-secondary);
    }
    
    .input-box {
      width: 100%;
      height: 69px; 
      border-radius: var(--radius-md);
      border: 1.5px solid var(--color-border);
      padding: 0 18px;
      display: flex;
      align-items: center; 
      background-color: white;
      transition: border-color var(--duration-micro) var(--ease-smooth), box-shadow var(--duration-micro) var(--ease-smooth);
    }
    .input-box:focus-within {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px var(--color-primary-subtle);
    }
    
    .input-value {
      font-family: var(--font-family-extrabold);
      font-weight: 800;
      color: var(--color-dark); 
      font-size: 20px;
      border: none;
      outline: none;
      background: transparent;
      width: 100%; 
      padding: 0;
    }
    .input-value::placeholder {
      color: var(--color-muted); 
      font-family: var(--font-family-semibold);
      font-weight: 600;
      font-size: 16px;
    }
    
    .input-suffix {
      font-family: var(--font-family-extrabold);
      font-weight: 800;
      color: var(--color-muted);
      font-size: 18px;
      margin-left: 10px;
      user-select: none;
    }

    .info-text {
      font-family: var(--font-family-semibold);
      font-weight: 600;
      color: var(--color-muted);
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
    }

    .back-arrow {
      cursor: pointer;
      transition: transform var(--duration-micro) var(--ease-smooth);
    }
    .back-arrow:hover {
      transform: translateX(-3px);
    }
  </style>
</head>
<body>

  <div class="personalization-container animate-fade-in">
    
    <header class="header-section">
      <div class="d-flex align-items-center mb-4">
        <a href="person1.html" class="me-3 back-arrow" aria-label="Back">
          <img src="../assets/back2.svg" alt="" width="18" height="36">
        </a>
        <h1 class="header-title flex-grow-1 mb-0">Personalization</h1>
        <div class="step-counter">
          <span class="step-num">Step 2</span> of 8
        </div>
      </div>
    </header>

    <main class="main-content">
      
      <div class="progress mb-4" role="progressbar" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100">
        <div class="progress-bar" style="width: 25%"></div>
      </div>
      
      <h2 class="subtitle mb-4">What's your current weight and height?</h2>

      <form id="metricsForm" onsubmit="handleMetricsSubmit(event)">
        <div class="mb-3">
          <label class="form-label font-bold text-muted mb-1" for="weightInput">WEIGHT</label>
          <div class="input-box">
            <input type="number" id="weightInput" class="input-value" placeholder="e.g. 65" min="30" max="300" step="0.5" required>
            <span class="input-suffix">kg</span>
          </div>
        </div>
        
        <div class="mb-3">
          <label class="form-label font-bold text-muted mb-1" for="heightInput">HEIGHT</label>
          <div class="input-box">
            <input type="number" id="heightInput" class="input-value" placeholder="e.g. 170" min="100" max="250" required>
            <span class="input-suffix">cm</span>
          </div>
        </div>
      </form>
    </main>

    <footer class="footer-section">
      <p class="info-text mb-3">
        We use this information to calculate your nutritional needs and make personalized recommendations.
      </p>
      
      <button type="button" onclick="document.getElementById('metricsForm').requestSubmit()" class="btn-next w-100" style="height: 50px; font-size: 17px;">
        Next
      </button>
    </footer>

  </div>

  <script src="../storage.js"></script>
  <script>
    if (window.BetterLifeState) {
      document.getElementById('weightInput').value = BetterLifeState.get('weight', 65);
      document.getElementById('heightInput').value = BetterLifeState.get('height', 170);
    }

    function handleMetricsSubmit(e) {
      e.preventDefault();
      const weight = parseFloat(document.getElementById('weightInput').value) || 65;
      const height = parseFloat(document.getElementById('heightInput').value) || 170;
      if (window.BetterLifeState) {
        BetterLifeState.set('weight', weight);
        BetterLifeState.set('height', height);
        BetterLifeState.calculateCalories();
      }
      window.location.href = 'person3.html';
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
