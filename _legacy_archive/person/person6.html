<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Personalization - Step 6 of 8 - Better Life</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../better-life.css" />

  <style>
    .header-section {
      padding: 1.5rem 1.5rem 0 1.5rem;
    }
    .main-content {
      flex-grow: 1;
      padding: 0 1.5rem;
    }
    .footer-section {
      padding: 2rem 1.5rem;
    }
    
    .header-title {
      font-family: var(--font-family-extrabold);
      font-weight: 800;
      color: #000000;
      font-size: 19px;
      letter-spacing: 0.5px;
    }
    .step-counter {
      font-family: var(--font-family-extrabold);
      font-weight: 800;
      font-size: 15px;
      color: var(--color-muted);
    }
    .step-counter .step-num {
      color: var(--color-primary);
    }
    
    .subtitle {
      font-family: var(--font-family-extrabold);
      font-weight: 800;
      color: #000000;
      font-size: 22px; 
      letter-spacing: 0.5px;
    }
    .progress-bar {
      background-color: var(--color-primary);
      transition: width var(--duration-component) var(--ease-smooth);
    }
    .progress {
      height: 6px;
      border-radius: 3px;
      background-color: var(--color-secondary);
    }
    
    .diet-card {
      display: flex;
      align-items: flex-start;
      padding: 1rem 1.25rem;
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-md);
      background-color: #ffffff;
      color: #000;
      transition: all var(--duration-micro) var(--ease-smooth);
      cursor: pointer;
      width: 100%;
    }
    
    .diet-card .ellipse {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid var(--color-border);
      margin-right: 1.1rem;
      margin-top: 0.25rem;
      flex-shrink: 0;
      transition: all var(--duration-micro) var(--ease-smooth);
    }
    
    .diet-text-content {
      display: flex;
      flex-direction: column;
    }
    .diet-card .diet-title {
      font-family: var(--font-family-extrabold);
      font-weight: 800;
      font-size: 18px;
      color: #000;
      line-height: 1.3;
    }
    .diet-card.active .diet-title {
      color: var(--color-primary);
    }
    .diet-card .diet-description {
      font-family: var(--font-family-semibold);
      font-weight: 600;
      font-size: 14px;
      color: var(--color-muted);
      line-height: 1.4;
      margin-top: 4px;
    }

    .info-text {
      font-family: var(--font-family-semibold);
      font-weight: 600;
      color: var(--color-muted);
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
    }

    .back-arrow {
      cursor: pointer;
      transition: transform var(--duration-micro) var(--ease-smooth);
    }
    .back-arrow:hover {
      transform: translateX(-3px);
    }
  </style>
</head>
<body>

  <div class="personalization-container animate-fade-in">
    
    <header class="header-section">
      <div class="d-flex align-items-center mb-4">
        <a href="person5.html" class="me-3 back-arrow" aria-label="Back">
          <img src="../assets/back2.svg" alt="" width="18" height="36">
        </a>
        <h1 class="header-title flex-grow-1 mb-0">Personalization</h1>
        <div class="step-counter">
          <span class="step-num">Step 6</span> of 8
        </div>
      </div>
    </header>

    <main class="main-content">
      <div class="progress mb-4" role="progressbar" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100">
        <div class="progress-bar" style="width: 75%"></div>
      </div>
      
      <h2 class="subtitle mb-4">Select the type of diet that best describes you:</h2>

      <div class="d-flex flex-column gap-3" role="radiogroup" aria-label="Diet type selection">
        <button type="button" class="diet-card active text-start border-0" data-diet="Omnivore" role="radio" aria-checked="true">
          <div class="ellipse"></div>
          <div class="diet-text-content">
            <span class="diet-title">Omnivore</span>
            <span class="diet-description">I eat meat and almost everything</span>
          </div>
        </button>
        
        <button type="button" class="diet-card text-start border-0" data-diet="Vegetarian" role="radio" aria-checked="false">
          <div class="ellipse"></div>
          <div class="diet-text-content">
            <span class="diet-title">Vegetarian</span>
            <span class="diet-description">I don't eat meat and fish</span>
          </div>
        </button>
        
        <button type="button" class="diet-card text-start border-0" data-diet="Flexitarian" role="radio" aria-checked="false">
          <div class="ellipse"></div>
          <div class="diet-text-content">
            <span class="diet-title">Flexitarian</span>
            <span class="diet-description">I try to reduce meat consumption</span>
          </div>
        </button>

        <button type="button" class="diet-card text-start border-0" data-diet="Vegan" role="radio" aria-checked="false">
          <div class="ellipse"></div>
          <div class="diet-text-content">
            <span class="diet-title">Vegan</span>
            <span class="diet-description">I only eat plant-based food</span>
          </div>
        </button>
        
        <button type="button" class="diet-card text-start border-0" data-diet="Pescetarian" role="radio" aria-checked="false">
          <div class="ellipse"></div>
          <div class="diet-text-content">
            <span class="diet-title">Pescetarian</span>
            <span class="diet-description">I don't eat meat, but I eat fish</span>
          </div>
        </button>

        <button type="button" class="diet-card text-start border-0" data-diet="Other" role="radio" aria-checked="false">
          <div class="ellipse"></div>
          <div class="diet-text-content">
            <span class="diet-title">Other</span>
            <span class="diet-description">My diet is not represented in the list</span>
          </div>
        </button>
      </div>
    </main>

    <footer class="footer-section">
      <p class="info-text mb-3">
        We use this information to calculate your nutritional needs and make personalized recommendations.
      </p>
      
      <a href="person7.html" class="btn-next w-100" style="height: 50px; font-size: 17px;" id="nextBtn">
        Next
      </a>
    </footer>

  </div>

  <script src="../storage.js"></script>
  <script>
    const savedDiet = BetterLifeState.get('dietType', 'Omnivore');
    const cards = document.querySelectorAll('.diet-card');

    cards.forEach(card => {
      const d = card.getAttribute('data-diet');
      if (d === savedDiet) {
        card.classList.add('active');
        card.setAttribute('aria-checked', 'true');
      } else {
        card.classList.remove('active');
        card.setAttribute('aria-checked', 'false');
      }

      card.addEventListener('click', function() {
        cards.forEach(c => {
          c.classList.remove('active');
          c.setAttribute('aria-checked', 'false');
        });
        this.classList.add('active');
        this.setAttribute('aria-checked', 'true');
        BetterLifeState.set('dietType', d);
      });
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
