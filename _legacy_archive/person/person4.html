<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Personalization - Step 4 of 8 - Better Life</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../better-life.css" />

  <style>
    .header-section { padding: 1.5rem 1.5rem 0 1.5rem; }
    .main-content { flex-grow: 1; padding: 0 1.5rem; }
    .footer-section { padding: 2rem 1.5rem; }
    
    .header-title {
      font-family: var(--font-family-extrabold);
      font-weight: 800;
      color: #000000;
      font-size: 19px;
      letter-spacing: 0.5px;
    }
    .step-counter {
      font-family: var(--font-family-extrabold);
      font-weight: 800;
      font-size: 15px;
      color: var(--color-muted);
    }
    .step-counter .step-num {
      color: var(--color-primary);
    }
    
    .subtitle {
      font-family: var(--font-family-extrabold);
      font-weight: 800;
      color: #000000;
      font-size: 22px; 
      letter-spacing: 0.5px;
    }
    .progress-bar {
      background-color: var(--color-primary);
      transition: width var(--duration-component) var(--ease-smooth);
    }
    .progress {
      height: 6px;
      border-radius: 3px;
      background-color: var(--color-secondary);
    }
    
    /* Interactive Date Picker Wheel Frame */
    .date-picker-frame {
      position: relative;
      height: 250px; 
      border-radius: var(--radius-md);
      background: #ffffff;
      border: 1.5px solid var(--color-border);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }
    
    .date-picker-highlight {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 50px;
      transform: translateY(-50%);
      background-color: var(--color-primary-subtle);
      border-top: 1.5px solid var(--color-primary);
      border-bottom: 1.5px solid var(--color-primary);
      z-index: 1;
      pointer-events: none;
    }
    
    .date-picker-frame::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 80px;
      background: linear-gradient(to bottom, #ffffff 40%, rgba(255, 255, 255, 0) 100%);
      z-index: 3;
      pointer-events: none;
    }
    
    .date-picker-frame::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 80px;
      background: linear-gradient(to top, #ffffff 40%, rgba(255, 255, 255, 0) 100%);
      z-index: 3;
      pointer-events: none;
    }
    
    .date-picker-column {
      height: 250px;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding-top: 100px;
      padding-bottom: 100px;
      position: relative;
      z-index: 2;
    }
    .date-picker-column::-webkit-scrollbar {
      display: none;
    }
    
    .picker-item {
      height: 50px;
      line-height: 50px;
      scroll-snap-align: center;
      text-align: center;
      font-family: var(--font-family-semibold);
      font-size: 19px;
      color: var(--color-muted);
      cursor: pointer;
      user-select: none;
      transition: color var(--duration-micro) var(--ease-smooth), transform var(--duration-micro) var(--ease-smooth);
    }
    .picker-item.active {
      color: var(--color-dark);
      font-family: var(--font-family-extrabold);
      font-weight: 800;
      transform: scale(1.08);
    }

    .info-text {
      font-family: var(--font-family-semibold);
      font-weight: 600;
      color: var(--color-muted);
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
    }

    .back-arrow {
      cursor: pointer;
      transition: transform var(--duration-micro) var(--ease-smooth);
    }
    .back-arrow:hover {
      transform: translateX(-3px);
    }
  </style>
</head>
<body>

  <div class="personalization-container animate-fade-in">
    
    <header class="header-section">
      <div class="d-flex align-items-center mb-4">
        <a href="person3.html" class="me-3 back-arrow" aria-label="Back">
          <img src="../assets/back2.svg" alt="" width="18" height="36">
        </a>
        <h1 class="header-title flex-grow-1 mb-0">Personalization</h1>
        <div class="step-counter">
          <span class="step-num">Step 4</span> of 8
        </div>
      </div>
    </header>

    <main class="main-content">
      <div class="progress mb-4" role="progressbar" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100">
        <div class="progress-bar" style="width: 50%"></div>
      </div>
      
      <h2 class="subtitle mb-4">What's your birth date?</h2>

      <div class="date-picker-frame">
        <div class="date-picker-highlight"></div>
        <div class="row g-0 h-100">
          <div class="col-3">
            <div class="date-picker-column" id="colDay">
              <!-- Days populated dynamically -->
            </div>
          </div>
          <div class="col-5">
            <div class="date-picker-column" id="colMonth">
              <!-- Months populated dynamically -->
            </div>
          </div>
          <div class="col-4">
            <div class="date-picker-column" id="colYear">
              <!-- Years populated dynamically -->
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer-section">
      <p class="info-text mb-3">
        We use this information to calculate your nutritional needs and make personalized recommendations.
      </p>
      
      <a href="person5.html" class="btn-next w-100" style="height: 50px; font-size: 17px;" id="nextBtn">
        Next
      </a>
    </footer>

  </div>

  <script src="../storage.js"></script>
  <script>
    const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    const savedBirth = BetterLifeState.get('birthDate', { day: 15, month: "June", year: 2000 });

    let selectedDay = savedBirth.day || 15;
    let selectedMonth = savedBirth.month || "June";
    let selectedYear = savedBirth.year || 2000;

    const colDay = document.getElementById('colDay');
    const colMonth = document.getElementById('colMonth');
    const colYear = document.getElementById('colYear');

    // Populate Days
    for (let d = 1; d <= 31; d++) {
      const item = document.createElement('div');
      item.className = 'picker-item' + (d === Number(selectedDay) ? ' active' : '');
      item.textContent = d;
      item.onclick = () => selectDay(d);
      colDay.appendChild(item);
    }

    // Populate Months
    months.forEach((m, idx) => {
      const item = document.createElement('div');
      item.className = 'picker-item' + (m === selectedMonth ? ' active' : '');
      item.textContent = m;
      item.onclick = () => selectMonth(m);
      colMonth.appendChild(item);
    });

    // Populate Years (1960 to 2015)
    for (let y = 1960; y <= 2015; y++) {
      const item = document.createElement('div');
      item.className = 'picker-item' + (y === Number(selectedYear) ? ' active' : '');
      item.textContent = y;
      item.onclick = () => selectYear(y);
      colYear.appendChild(item);
    }

    function selectDay(d) {
      selectedDay = d;
      updateActive(colDay, d);
      save();
    }

    function selectMonth(m) {
      selectedMonth = m;
      updateActive(colMonth, m);
      save();
    }

    function selectYear(y) {
      selectedYear = y;
      updateActive(colYear, y);
      save();
    }

    function updateActive(col, val) {
      col.querySelectorAll('.picker-item').forEach(el => {
        if (el.textContent == val) {
          el.classList.add('active');
          el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        } else {
          el.classList.remove('active');
        }
      });
    }

    function save() {
      BetterLifeState.set('birthDate', {
        day: selectedDay,
        month: selectedMonth,
        year: selectedYear
      });
    }

    // Scroll initial into view
    setTimeout(() => {
      colDay.querySelector('.picker-item.active')?.scrollIntoView({ block: 'center' });
      colMonth.querySelector('.picker-item.active')?.scrollIntoView({ block: 'center' });
      colYear.querySelector('.picker-item.active')?.scrollIntoView({ block: 'center' });
    }, 100);
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
