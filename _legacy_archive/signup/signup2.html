<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create Account - Step 1 of 3 - Better Life</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../better-life.css" />

  <style>
    .header-section {
      padding: 1.5rem 1.5rem 0 1.5rem;
    }
    .header-title {
      font-family: var(--font-family-extrabold);
      font-weight: 800;
      color: #000000;
      font-size: 19px;
      letter-spacing: 0.5px;
    }
    .step-counter {
      font-family: var(--font-family-extrabold);
      font-weight: 800;
      font-size: 15px;
      color: var(--color-muted); 
    }
    .step-counter .step-num {
      color: var(--color-primary);
    }
    
    .main-content {
      flex-grow: 1;
      padding: 0 1.5rem;
    }

    .subtitle {
      font-family: var(--font-family-extrabold);
      font-weight: 800;
      color: #000000;
      font-size: 20px;
      letter-spacing: 0.5px;
    }
    .progress-bar {
      background-color: var(--color-primary);
      transition: width var(--duration-component) var(--ease-smooth);
    }
    .progress {
      height: 6px;
      border-radius: 3px;
      background-color: var(--color-secondary);
    }

    .custom-input-group { 
      position: relative; 
    }
    .input-box {
      width: 100%;
      height: 69px; 
      border-radius: var(--radius-md);
      border: 1.5px solid var(--color-border);
      padding: 10px 15px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background-color: white;
      transition: border-color var(--duration-micro) var(--ease-smooth), box-shadow var(--duration-micro) var(--ease-smooth);
    }
    .input-box:focus-within {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px var(--color-primary-subtle);
    }
    .input-label {
      font-family: var(--font-family-extrabold);
      font-weight: 800;
      color: var(--color-muted);
      font-size: 14px;
      margin-bottom: 2px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .input-value {
      font-family: var(--font-family-semibold);
      font-weight: 600;
      color: var(--color-dark); 
      font-size: 17px;
      border: none;
      outline: none;
      background: transparent;
      width: 100%;
      padding: 0;
    }
    .country-code-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 69px;
      border-radius: var(--radius-md);
      border: 1.5px solid var(--color-border);
      padding: 10px 15px;
      background-color: white;
      cursor: pointer;
      user-select: none;
    }
    .country-code-box .flag {
      width: 24px;
      height: 16px;
      background: linear-gradient(to bottom, #FF0000 50%, #FFFFFF 50%);
      border: 1px solid #ccc;
      border-radius: 2px;
    }
    .country-code-box .code {
      font-family: var(--font-family-semibold);
      font-weight: 600;
      color: #333;
      font-size: 17px;
      margin: 0 5px;
    }

    .footer-section {
      padding: 2rem 1.5rem;
    }
    .back-arrow {
      cursor: pointer;
      transition: transform var(--duration-micro) var(--ease-smooth);
    }
    .back-arrow:hover {
      transform: translateX(-3px);
    }
  </style>
</head>
<body>

  <div class="signup-container animate-fade-in">
    
    <div class="header-section">
      <div class="d-flex align-items-center mb-4">
        <a href="signup1.html" class="me-3 back-arrow" aria-label="Back">
          <img src="../assets/back2.svg" alt="" width="18" height="36">
        </a>
        <h1 class="header-title flex-grow-1 mb-0">Create Account</h1>
        <div class="step-counter">
          <span class="step-num">Step 1</span> of 3
        </div>
      </div>
    </div>

    <div class="main-content">
      <h2 class="subtitle mb-3">Complete Account Setup</h2>
      <div class="progress mb-4" role="progressbar" aria-valuenow="33" aria-valuemin="0" aria-valuemax="100">
        <div class="progress-bar" style="width: 33.3%"></div>
      </div>

      <form id="step1Form" onsubmit="handleStep1Submit(event)">
        <div class="custom-input-group mb-3">
          <div class="input-box">
            <label class="input-label" for="emailInput">Email</label>
            <input type="email" id="emailInput" class="input-value" value="someone@example.com" required>
          </div>
        </div>
        <div class="mb-3">
          <label class="input-label mb-2">Phone</label>
          <div class="row g-2">
            <div class="col-auto" style="min-width: 120px;">
              <div class="country-code-box" title="Indonesia (+62)">
                <div class="flag"></div> 
                <span class="code">+62</span>
                <img src="../assets/arrowdown.svg" alt="" width="16" height="16">
              </div>
            </div>
            <div class="col">
              <div class="input-box" style="padding-top: 15px; padding-bottom: 15px;">
                <input type="tel" id="phoneInput" class="input-value" placeholder="8123456789" value="8123456789" required>
              </div>
            </div>
          </div>
        </div>
      </form>
    </div>

    <div class="footer-section">
      <div class="row g-2">
        <div class="col-6">
          <a href="signup1.html" class="btn-back w-100" style="height: 50px;">Back</a>
        </div>
        <div class="col-6">
          <button type="button" onclick="document.getElementById('step1Form').requestSubmit()" class="btn-continue w-100" style="height: 50px;">
            Continue
          </button>
        </div>
      </div>
    </div>

  </div>

  <script src="../storage.js"></script>
  <script>
    // Prefill from storage if exists
    if (window.BetterLifeState) {
      const user = BetterLifeState.get('user', {});
      if (user.email) document.getElementById('emailInput').value = user.email;
      if (user.phone) {
        const p = user.phone.replace('+62', '').trim();
        document.getElementById('phoneInput').value = p;
      }
    }

    function handleStep1Submit(e) {
      e.preventDefault();
      const email = document.getElementById('emailInput').value.trim();
      const phone = '+62 ' + document.getElementById('phoneInput').value.trim();
      if (window.BetterLifeState) {
        BetterLifeState.updateUser({ email, phone });
      }
      window.location.href = 'signup3.html';
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
