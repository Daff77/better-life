<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Verification - Step 2 of 3 - Better Life</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../better-life.css" />

  <style>
    .header-section {
      padding: 1.5rem 1.5rem 0 1.5rem;
    }
    .main-content {
      flex-grow: 1;
      padding: 0 1.5rem;
    }
    .footer-section {
      padding: 2rem 1.5rem;
    }
    
    .header-title {
      font-family: var(--font-family-extrabold);
      font-weight: 800;
      color: #000000;
      font-size: 19px;
      letter-spacing: 0.5px;
    }
    .step-counter {
      font-family: var(--font-family-extrabold);
      font-weight: 800;
      font-size: 15px;
      color: var(--color-muted); 
    }
    .step-counter .step-num {
      color: var(--color-primary);
    }
    
    .subtitle {
      font-family: var(--font-family-extrabold);
      font-weight: 800;
      color: #000000;
      font-size: 20px;
      letter-spacing: 0.5px;
    }
    .progress-bar {
      background-color: var(--color-primary);
      transition: width var(--duration-component) var(--ease-smooth);
    }
    .progress {
      height: 6px;
      border-radius: 3px;
      background-color: var(--color-secondary);
    }

    .input-box {
      width: 100%;
      height: 69px; 
      border-radius: var(--radius-md);
      border: 1.5px solid var(--color-border);
      padding: 10px 15px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background-color: white;
      transition: border-color var(--duration-micro) var(--ease-smooth), box-shadow var(--duration-micro) var(--ease-smooth);
    }
    .input-box:focus-within {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px var(--color-primary-subtle);
    }
    
    .input-label {
      font-family: var(--font-family-extrabold);
      font-weight: 800;
      color: var(--color-muted);
      font-size: 14px;
      margin-bottom: 2px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .otp-input {
      font-family: var(--font-family-extrabold);
      font-weight: 800;
      font-size: 24px;
      letter-spacing: 6px;
      color: var(--color-dark);
      border: none;
      outline: none;
      background: transparent;
      width: 100%;
      padding: 0;
    }
    
    .resend-box {
      font-family: var(--font-family-semibold);
      font-size: 14px;
      color: var(--color-muted);
      margin-top: 1rem;
    }
    .resend-box a {
      color: var(--color-primary);
      font-weight: 700;
      margin-left: 4px;
    }

    .back-arrow {
      cursor: pointer;
      transition: transform var(--duration-micro) var(--ease-smooth);
    }
    .back-arrow:hover {
      transform: translateX(-3px);
    }
  </style>
</head>
<body>

  <div class="signup-container animate-fade-in">
    
    <header class="header-section">
      <div class="d-flex align-items-center mb-4">
        <a href="signup2.html" class="me-3 back-arrow" aria-label="Back">
          <img src="../assets/back2.svg" alt="" width="18" height="36">
        </a>
        <h1 class="header-title flex-grow-1 mb-0">Create Account</h1>
        <div class="step-counter">
          <span class="step-num">Step 2</span> of 3
        </div>
      </div>
    </header>

    <main class="main-content">
      <h2 class="subtitle mb-3">Complete Account Setup</h2>
      
      <div class="progress mb-4" role="progressbar" aria-valuenow="66.6" aria-valuemin="0" aria-valuemax="100">
        <div class="progress-bar" style="width: 66.6%"></div>
      </div>

      <form id="otpForm" onsubmit="handleOtpSubmit(event)">
        <div class="custom-input-group mb-2">
          <div class="input-box">
            <label class="input-label" for="otpInput">OTP Code</label>
            <input type="text" id="otpInput" class="otp-input" placeholder="••••••" maxlength="6" value="524910" required autofocus>
          </div>
        </div>
        <div class="resend-box text-center">
          <span>Didn't receive code?</span>
          <a href="#" onclick="alert('New verification code sent!'); return false;">Resend Code</a>
        </div>
      </form>
    </main>

    <footer class="footer-section">
      <div class="row g-2">
        <div class="col-6">
          <a href="signup2.html" class="btn-back w-100" style="height: 50px;">Back</a>
        </div>
        <div class="col-6">
          <button type="button" onclick="document.getElementById('otpForm').requestSubmit()" class="btn-continue w-100" style="height: 50px;">
            Continue
          </button>
        </div>
      </div>
    </footer>

  </div>

  <script src="../storage.js"></script>
  <script>
    function handleOtpSubmit(e) {
      e.preventDefault();
      window.location.href = 'signup4.html';
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
