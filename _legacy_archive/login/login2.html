<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - Better Life</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../better-life.css" />

  <style>
    .header-section, .main-section, .footer-section {
      padding: 0 1.5rem;
    }
    
    .header-section {
      padding-top: 2rem;
    }
    
    .main-section {
      flex-grow: 1;
      padding-top: 1rem;
      padding-bottom: 2rem;
    }
    
    .footer-section {
      padding-bottom: 3rem;
    }

    .back-button {
      cursor: pointer;
      padding: 6px 12px 6px 0;
      margin-bottom: 1.5rem;
      display: inline-block;
      transition: transform var(--duration-micro) var(--ease-smooth);
    }
    .back-button:hover {
      transform: translateX(-3px);
    }

    .title-welcome {
      font-family: var(--font-family-display);
      font-weight: 700;
      color: var(--color-primary);
      font-size: 32px;
      margin-bottom: 0.5rem;
    }

    .subtitle-login {
      font-family: var(--font-family-semibold);
      font-weight: 600;
      color: var(--color-muted);
      font-size: 17px;
      letter-spacing: 0.5px;
      margin-bottom: 2.5rem;
    }

    .custom-input-group {
      position: relative;
      margin-bottom: 1.25rem;
    }

    .input-box {
      width: 100%;
      height: 69px;
      border-radius: var(--radius-md);
      border: 1.5px solid var(--color-border);
      padding: 10px 15px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background-color: white;
      transition: border-color var(--duration-micro) var(--ease-smooth), box-shadow var(--duration-micro) var(--ease-smooth);
    }

    .input-box:focus-within {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px var(--color-primary-subtle);
    }

    .input-label {
      font-family: var(--font-family-extrabold);
      font-weight: 800;
      color: var(--color-muted);
      font-size: 14px;
      margin-bottom: 2px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-value {
      font-family: var(--font-family-semibold);
      font-weight: 600;
      color: var(--color-dark);
      font-size: 17px;
      border: none;
      outline: none;
      background: transparent;
      width: 100%;
      padding: 0;
    }

    .eye-icon {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity var(--duration-micro) var(--ease-smooth);
    }
    .eye-icon:hover {
      opacity: 0.75;
    }

    .forgot-password {
      display: block;
      text-align: right;
      font-family: var(--font-family-semibold);
      font-weight: 600;
      color: var(--color-primary);
      font-size: 15px;
      letter-spacing: 0.45px;
      margin-bottom: 2rem;
      text-decoration: none;
    }
    .forgot-password:hover {
      text-decoration: underline;
    }

    .register-area {
      margin-top: 2.5rem;
      text-align: center;
    }
    .text-dont-have {
      font-family: var(--font-family-semibold);
      font-weight: 600;
      color: var(--color-muted);
      font-size: 15px;
    }
    .text-register-now {
      font-family: var(--font-family-extrabold);
      font-weight: 800;
      color: var(--color-primary);
      font-size: 15px;
      margin-left: 5px;
      text-decoration: none;
    }
    .text-register-now:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="login-container animate-fade-in">
    
    <header class="header-section">
      <a href="login1.html" class="back-button" aria-label="Go back to welcome screen">
        <img src="../assets/back2.svg" alt="" width="18" height="36">
      </a>

      <div class="text-center">
        <img class="mb-3" src="../assets/Better Life.png" alt="Better Life Logo" style="width: 130px; height: 130px; object-fit: contain;" />
        <h1 class="title-welcome">Welcome!</h1>
        <p class="subtitle-login">Login to your Account</p>
      </div>
    </header>

    <main class="main-section">
      <form id="loginForm" onsubmit="handleLoginSubmit(event)">
        <div class="custom-input-group">
          <div class="input-box">
            <label class="input-label" for="emailInput">Email</label>
            <input type="email" id="emailInput" class="input-value" placeholder="someone@example.com" value="johndoe25@gmail.com" required>
          </div>
        </div>

        <div class="custom-input-group">
          <div class="input-box" style="padding-right: 48px;">
            <label class="input-label" for="passwordInput">Password</label>
            <input type="password" id="passwordInput" class="input-value" placeholder="••••••••••••" value="betterlife2026" required>
          </div>
          <button type="button" class="eye-icon border-0 bg-transparent" id="togglePasswordBtn" aria-label="Toggle password visibility">
            <img src="../assets/eye.svg" alt="" width="24" height="24">
          </button>
        </div>

        <a href="#" class="forgot-password" onclick="alert('Password reset link has been sent to your email.'); return false;">Forgot password?</a>

        <button type="submit" class="btn-login w-100" style="height: 50px; font-size: 17px;">
          Login
        </button>
      </form>
    </main>

    <footer class="footer-section">
      <div class="register-area">
        <span class="text-dont-have">Don't have an account?</span>
        <a href="../signup/signup1.html" class="text-register-now">Register Now</a>
      </div>
    </footer>

  </div>

  <script src="../storage.js"></script>
  <script>
    // Password toggle
    const toggleBtn = document.getElementById('togglePasswordBtn');
    const pwdInput = document.getElementById('passwordInput');
    toggleBtn.addEventListener('click', () => {
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
      } else {
        pwdInput.type = 'password';
      }
    });

    // Form submission
    function handleLoginSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('emailInput').value.trim();
      if (window.BetterLifeState) {
        BetterLifeState.updateUser({ email: email || 'johndoe25@gmail.com' });
      }
      window.location.href = '../home.html';
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
