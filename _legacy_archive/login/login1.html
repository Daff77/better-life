<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome - Better Life</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../better-life.css" />

  <style>
    .header-section, .main-section, .footer-section {
      padding-left: 2.5rem;
      padding-right: 2.5rem;
    }
    
    .header-section {
      padding-top: 3.5rem;
      padding-bottom: 1.5rem;
    }
    
    .main-section {
      flex-grow: 1;
      padding-top: 1.5rem;
      padding-bottom: 2rem;
    }
    
    .footer-section {
      padding-bottom: 2.5rem;
    }

    .better-life-logo {
      width: 140px;
      height: 140px;
      object-fit: contain;
      transition: transform var(--duration-component) var(--ease-bounce-subtle);
    }
    .better-life-logo:hover {
      transform: scale(1.04);
    }

    .login-title {
      font-family: var(--font-family-display); 
      font-weight: 700;
      color: var(--color-primary);
      font-size: 32px; 
    }
    .login-subtitle {
      font-family: var(--font-family-semibold);
      font-weight: 600; 
      color: var(--color-muted);
      font-size: 17px; 
      letter-spacing: 0.5px;
    }
    .divider-or {
      font-family: var(--font-family-semibold);
      font-weight: 600;
      color: var(--color-muted);
      font-size: 16px;
    }
    .btn-social img {
      width: 22px;
      height: 22px;
      object-fit: contain;
    }
    .register-text {
      font-family: var(--font-family-semibold);
      font-weight: 600;
      color: var(--color-muted);
      font-size: 15px;
    }
    .register-text a {
      font-family: var(--font-family-extrabold);
      font-weight: 800;
      color: var(--color-primary);
      margin-left: 4px;
    }
    .register-text a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="login-container animate-fade-in">
    
    <header class="header-section text-center">
      <img class="better-life-logo mb-3" src="../assets/Better Life.png" alt="Better Life Logo" />
      <h1 class="login-title mb-2">Welcome!</h1>
      <p class="login-subtitle">Login to your Account</p>
    </header>
    
    <main class="main-section">
      <div class="d-grid">
        <a href="login2.html" class="btn-ijo-utama d-flex align-items-center justify-content-center mb-4" role="button" style="height: 50px; font-size: 17px;">
          <img src="../assets/panah login.svg" alt="" width="18" height="18" class="me-2" style="filter: brightness(0) invert(1);">
          <span>Login</span>
        </a>
      </div>

      <div class="d-flex align-items-center mb-4">
        <hr class="flex-grow-1" style="border-color: var(--color-border-light);">
        <span class="px-3 divider-or">OR</span>
        <hr class="flex-grow-1" style="border-color: var(--color-border-light);">
      </div>

      <div class="d-grid gap-3">
        <a href="../home.html" class="btn-social" role="button" onclick="handleSocialLogin('Google')">
          <img src="../assets/google.svg" alt="Google logo">
          <span>Login with Google</span>
        </a>
        <a href="../home.html" class="btn-social" role="button" onclick="handleSocialLogin('Facebook')">
          <img src="../assets/fb.svg" alt="Facebook logo">
          <span>Login with Facebook</span>
        </a>
        <a href="../home.html" class="btn-social" role="button" onclick="handleSocialLogin('Apple')">
          <img src="../assets/apple.svg" alt="Apple logo">
          <span>Login with Apple</span>
        </a>
      </div>
    </main>

    <footer class="footer-section">
      <div class="text-center register-text">
        <span>Don't have an account?</span>
        <a href="../signup/signup1.html">Register Now</a>
      </div>
    </footer>

  </div>

  <script src="../storage.js"></script>
  <script>
    function handleSocialLogin(provider) {
      if (window.BetterLifeState) {
        BetterLifeState.updateUser({ name: 'John Doe' });
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
