<!DOCTYPE html>
<html lang="id">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <meta name="description" content="Better Life - Health and wellness application" />
    <title>Better Life</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="better-life.css" />

    <style>
        .splash-body {
            background-color: #ffffff;
            width: 100%;
            height: 100vh;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            user-select: none;
        }

        .splash-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            object-fit: cover;
            object-position: center;
            z-index: 1;
            opacity: 0;
            animation: fadeIn 0.8s ease-out forwards;
        }
        
        .logo-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        .better-life {
            width: 192px;
            height: 192px;
            aspect-ratio: 1;
            object-fit: contain;
            opacity: 0;
            transform: scale(0.9);
            animation: popIn 0.8s 0.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        .tap-hint {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            text-align: center;
            font-family: var(--font-family-semibold);
            font-size: 14px;
            color: var(--color-muted);
            z-index: 3;
            opacity: 0;
            animation: fadeIn 0.6s 1.2s ease-out forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        @keyframes popIn {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>

<body class="splash-body" onclick="goToNextScreen()">

    <img class="splash-bg" src="assets/Group 290.svg" alt="Decorative background pattern" aria-hidden="true" />

    <main class="logo-container d-flex align-items-center justify-content-center" role="main">
        <img class="better-life" src="assets/Better Life.png" alt="Better Life logo" />
    </main>

    <div class="tap-hint">Tap anywhere to continue</div>

    <script>
        function goToNextScreen() {
            window.location.href = 'login/login1.html';
        }

        // Auto transition after 2.4 seconds
        setTimeout(goToNextScreen, 2400);
    </script>
</body>
</html>
